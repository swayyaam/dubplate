[workspace]
resolver = "2"
members = ["src-tauri", "crates/audio", "crates/library"]

[workspace.package]
version    = "0.1.0"
edition    = "2021"
license    = "MIT"
repository = "https://github.com/swayyaam/dubplate"

[workspace.dependencies]
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow     = "1"
thiserror  = "2"
tracing    = "0.1"

# Release builds of the audio path want optimisation even in dev, otherwise
# debug-mode decoding cannot keep the ring buffer fed. Harmless before phase 2,
# and one less thing to discover the hard way later.
[profile.dev.package."*"]
opt-level = 2
