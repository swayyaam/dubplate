[package]
name        = "dubplate"
description = "A minimal, art-forward desktop player for a personal lossless collection"
authors     = ["Swayam Mishra"]
version.workspace    = true
edition.workspace    = true
license.workspace    = true
repository.workspace = true

[lib]
# The `_lib` suffix is required so the lib name does not collide with the bin
# name on Windows. See rust-lang/cargo#8519.
name = "dubplate_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
dubplate-library = { path = "../crates/library" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde.workspace      = true
serde_json.workspace = true
